name: Publicador Diario

# El disparo a horario lo hace cron-job.org (disparador externo confiable, en hora de
# Argentina) llamando a la API de workflow_dispatch. NO se usa el scheduler nativo de
# GitHub (schedule:) para el grueso porque no es confiable y chocaba con cron-job.org.
# EXCEPCION: el posteo del MURO tapa+farmacias de las 00:00 SI usa schedule nativo: a esa
# hora no hay ningun cron de cron-job.org en el grupo `publicador`, asi que no choca, y una
# demora de unos minutos a la medianoche es tolerable para un posteo diario.
# Tambien se puede correr a mano desde la pestana Actions -> Run workflow.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 00:00 Argentina (UTC-3): muro FB tapa+farmacias
  workflow_dispatch:
    inputs:
      args:
        description: 'Argumentos para main.py (ej: --dry-run | --canal-story | --run-now --pages 3,5,7)'
        required: true
        default: '--dry-run'

# Evita que dos corridas se pisen (importante para no corromper los registros). GitHub deja 1
# corriendo + 1 en espera por grupo y CANCELA lo que quede "pending". Por eso cada PROYECTO tiene
# su propio grupo: asi el trafico de un flujo (p.ej. el desgrabador de video cada 5 min, o los
# reels de corresponsales) NUNCA cancela la publicacion de otro (p.ej. la carga de notas a la web).
# Cada grupo serializa SOLO consigo mismo (para no corromper SU ledger). (2026-08-19)
# Grupos (el orden importa: gana la primera coincidencia):
#   - publicador-tapa-farmacias : --tapa-farmacias / --farmacias / --muro-tapa-farmacias / --tapa
#                                 (+ el cron nativo 0 3 = muro). Comparten los ledgers de tapa/farmacias.
#   - publicador-radio          : TODO lo de la radio (*-radio): transcribe/publish/placa/editar-*-radio.
#   - publicador-corresponsales : bot de corresponsales por FOTO (--placa / --placa-publish) y --corresponsales-ranking.
#                                 (Los VIDEOS de corresponsales usan --transcribe-video → caen en publicador-videos,
#                                  porque comparten la MISMA cola/ledger que los videos del diario y deben serializar.)
#   - publicador-yt-seo         : --yt-seo* (SEO de YouTube).
#   - publicador-yt-desgrabador : --yt-desgrabar (notas de YouTube de Radio del Centro a texto).
#   - publicador-videos         : desgrabador de VIDEOS del diario (y corresponsales): transcribe/publish-video.
#   - publicador-notas-web      : --notas-web ("notas para web": Word+foto+video por subcarpeta).
#   - publicador-historias      : --news-stories / --yt-live / --yt-notes / --canal-story / --sepelios.
#   - publicador-notas          : carga de notas del diario a WEB/FB/IG: --notes-web / --notes-carousel / --run-now.
#   - publicador-otros          : el resto manual/raro (--mail, --newsletter, --reel, --repost, --videos-report, --dry-run).
# Nota anti-falsos-positivos: se usa '-radio' (con guion) para no confundir un email de --uploader
# que contenga "radio"; y 'corresponsales' (plural) no matchea el --file "corresponsal_..." (singular).
concurrency:
  group: >-
    ${{
    (github.event.schedule == '0 3 * * *') && 'publicador-tapa-farmacias'
    || contains(github.event.inputs.args, '-radio') && 'publicador-radio'
    || (contains(github.event.inputs.args, 'placa') || contains(github.event.inputs.args, 'corresponsales')) && 'publicador-corresponsales'
    || contains(github.event.inputs.args, 'yt-seo') && 'publicador-yt-seo'
    || contains(github.event.inputs.args, 'yt-desgrabar') && 'publicador-yt-desgrabador'
    || (contains(github.event.inputs.args, 'transcribe-video') || contains(github.event.inputs.args, 'publish-video')) && 'publicador-videos'
    || contains(github.event.inputs.args, 'notas-web') && 'publicador-notas-web'
    || (contains(github.event.inputs.args, 'farmacias') || contains(github.event.inputs.args, 'tapa') || contains(github.event.inputs.args, 'muro')) && 'publicador-tapa-farmacias'
    || (contains(github.event.inputs.args, 'news-stories') || contains(github.event.inputs.args, 'yt-live') || contains(github.event.inputs.args, 'yt-notes') || contains(github.event.inputs.args, 'canal-story') || contains(github.event.inputs.args, 'sepelios')) && 'publicador-historias'
    || (contains(github.event.inputs.args, 'notes-web') || contains(github.event.inputs.args, 'notes-carousel') || contains(github.event.inputs.args, 'run-now')) && 'publicador-notas'
    || 'publicador-otros'
    }}
  cancel-in-progress: false

# Necesario para commitear de vuelta los registros anti-repeticion.
permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Respaldo: si una corrida se cuelga (apt/rclone/pip/Gemini), que se auto-cancele en 40 min y
    # libere su grupo, en vez de retenerlo hasta 3 horas y provocar la tormenta de cancelaciones.
    timeout-minutes: 40
    # El runner corre en UTC; con esto Python usa hora de Argentina para
    # date.today()/now() (clave para detectar la "edicion de hoy" y los ledgers diarios).
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4
        with:
          # Traer la PUNTA de main, no el commit de cuando se encolo la corrida.
          # Si el mismo video se aprueba dos veces (doble toque/prefetch del boton del
          # mail), se encolan 2 corridas con el MISMO commit; el concurrency las
          # serializa, pero la 2da restauraba el ledger VIEJO (sin el "publicado" que
          # dejo la 1ra) y volvia a postear -> reel duplicado en Instagram. Con ref: main
          # la 2da ve el estado nuevo y se saltea sola.
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar fuentes y ffmpeg (historias 9:16 + reel en video)
        # El apt de GitHub a veces se CUELGA (un mirror/infra del runner que no responde). Antes eso
        # trababa la corrida y, con timeout largo, retenia el grupo de concurrency por horas → tormenta
        # de cancelaciones. Ahora es resiliente: cada intento de apt esta acotado con `timeout` (si un
        # mirror se cuelga lo mata en ~90/150s) y se reintenta 3 veces (suele pegarle a otro mirror sano).
        # Si aun asi falla pero el runner ya trae ffmpeg preinstalado, sigue igual (las fuentes tienen
        # fallback). El timeout-minutes del paso es la red de seguridad final para no retener el grupo.
        timeout-minutes: 9
        run: |
          instalar() {
            timeout -k 15 90 sudo apt-get update && \
            timeout -k 15 150 sudo apt-get install -y fonts-liberation fonts-dejavu-core ffmpeg
          }
          ok=0
          for i in 1 2 3; do
            if instalar; then ok=1; break; fi
            echo "apt intento $i fallo o se colgo; mato procesos apt y reintento en 5s…"
            sudo killall -q apt-get apt dpkg 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            if command -v ffmpeg >/dev/null 2>&1; then
              echo "apt no instalo, pero ffmpeg ya esta en el runner → sigo (fuentes con fallback)."
              exit 0
            fi
            echo "apt fallo 3 veces y no hay ffmpeg en el runner → aborto."
            exit 1
          fi

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Instalar rclone
        run: |
          sudo -v
          # Reintentar: a veces el install.sh flaquea y rclone no queda en PATH (exit 127).
          for i in 1 2 3; do
            curl -fsSL https://rclone.org/install.sh | sudo bash || true
            if command -v rclone >/dev/null 2>&1; then break; fi
            echo "rclone no quedó instalado (intento $i); reintento en 5s…"
            sleep 5
          done
          command -v rclone >/dev/null 2>&1 || { echo "ERROR: no se pudo instalar rclone"; exit 1; }
          rclone version | head -1

      - name: Escribir credenciales (.env) y config de Drive (rclone)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Escribir token OAuth de YouTube (para --yt-desgrabar y --yt-seo-auto)
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_SHORTS_TOKEN_JSON: ${{ secrets.YT_SHORTS_TOKEN_JSON }}
        run: |
          # Token del canal RADIO DEL CENTRO: lo usan el SEO (editar título/desc/miniatura) y
          # el desgrabador de notas (listar la sección Videos sin shorts ni vivos). El JSON ya
          # trae client_id/client_secret/refresh_token, así que se refresca solo en cada corrida.
          # SOLO se escribe si el secret existe → para el resto de los comandos del publicador
          # (tapa, farmacias, reel, etc.) este paso es INERTE y no cambia nada.
          if [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > .yt_token.json
            echo "Token de YouTube (Radio del Centro) escrito."
          else
            echo "Sin secret YT_TOKEN_JSON: los comandos --yt-seo-auto/--yt-desgrabar no correran en la nube (el resto no se afecta)."
          fi
          # Token del canal DIARIO LA CAMPAÑA (Shorts del desgrabador de videos). Opcional.
          if [ -n "$YT_SHORTS_TOKEN_JSON" ]; then
            printf '%s' "$YT_SHORTS_TOKEN_JSON" > .yt_token_diario.json
            echo "Token de YouTube (Diario, shorts) escrito."
          fi

      - name: Bajar la carpeta del dia desde Google Drive
        env:
          # Por env (NO inline) para no romper si el nombre del video trae espacios/comillas.
          ARGS: ${{ github.event.inputs.args }}
        run: |
          mkdir -p diario
          # Asegura que las carpetas existan aunque esten vacias en Drive
          mkdir -p "diario/NOTAS AUTOMATICAS" "diario/DIARIO PDF"
          # Los comandos de video (desgrabador) NO necesitan toda la carpeta Diario:
          # saltear el sync pesado acelera esas corridas varios minutos.
          if echo "$ARGS" | grep -qE -- "video|placa|yt-desgrabar|yt-seo"; then
            echo "Comando que NO usa la edición: se saltea el sync completo de gdrive:Diario."
          else
            rclone sync "gdrive:Diario" diario
          fi

      - name: Bajar videos de actualidad desde Google Drive (desgrabador)
        run: |
          mkdir -p videos
          # La carpeta "videos notas actualidad" puede estar dentro de Diario o en la raiz del Drive.
          rclone copy "gdrive:Diario/videos notas actualidad" videos 2>/dev/null || true
          rclone copy "gdrive:videos notas actualidad" videos 2>/dev/null || true
          # Carpeta "notas para web" (Word + foto + video por subcarpeta) → notas_web/
          mkdir -p notas_web
          rclone copy "gdrive:Diario/notas para web" notas_web 2>/dev/null || true
          rclone copy "gdrive:notas para web" notas_web 2>/dev/null || true

      - name: Bajar videos de la RADIO desde Google Drive (radiodelcentro)
        env:
          ARGS: ${{ github.event.inputs.args }}
        run: |
          # Solo para los comandos de la radio (*-radio): usan el SEGUNDO remoto de rclone
          # (gdrive_radio → cuenta radiodelcentro). Para el resto del publicador este paso es INERTE.
          if echo "$ARGS" | grep -qE -- "radio"; then
            mkdir -p videos_radio
            # La carpeta "videos radio" puede estar en la raiz del Drive o dentro de una subcarpeta.
            rclone copy "gdrive_radio:videos radio" videos_radio 2>/dev/null || true
            rclone copy "gdrive_radio:Radio/videos radio" videos_radio 2>/dev/null || true
          else
            echo "Sin args de radio: no se baja la carpeta de la radio."
          fi

      - name: Restaurar registros anti-repeticion
        run: |
          [ -f "state/.publicado.json" ] && cp "state/.publicado.json" "diario/NOTAS AUTOMATICAS/.publicado.json" || true
          [ -f "state/.historias.json" ] && cp "state/.historias.json" "diario/NOTAS AUTOMATICAS/.historias.json" || true
          [ -f "state/.web.json" ] && cp "state/.web.json" "diario/NOTAS AUTOMATICAS/.web.json" || true
          [ -f "state/.fb.json" ] && cp "state/.fb.json" "diario/NOTAS AUTOMATICAS/.fb.json" || true
          [ -f "state/.x.json" ] && cp "state/.x.json" "diario/NOTAS AUTOMATICAS/.x.json" || true
          for f in .tapa.json .farmacias.json .farmacias_cache.json .farmacias_aviso.json .carrusel_tf.json .carrusel_tf_aviso.json .muro_tf.json .canal_story.json youtube-historias.json .newsletter.json .reel.json .videos_contabilidad.json .videos_radio.json .notas_web.json .yt_desgrabaciones.json .yt_seo.json; do
            [ -f "state/$f" ] && cp "state/$f" "./$f" || true
          done

      - name: Determinar el comando segun el horario
        id: cmd
        run: |
          case "${{ github.event.schedule }}" in
            "0 3 * * *")      echo 'args=--muro-tapa-farmacias' >> "$GITHUB_OUTPUT" ;;
            "0 10 * * *")     echo 'args=--run-now --pages 3,5,7' >> "$GITHUB_OUTPUT" ;;
            "15 10 * * *")    echo 'args=--news-stories' >> "$GITHUB_OUTPUT" ;;
            "0 11 * * *")     echo 'args=--farmacias' >> "$GITHUB_OUTPUT" ;;
            "45 13 * * 1-5")  echo 'args=--yt-live' >> "$GITHUB_OUTPUT" ;;
            "0 16 * * *")     echo 'args=--run-now --pages 8,9' >> "$GITHUB_OUTPUT" ;;
            "30 16 * * *")    echo 'args=--yt-notes' >> "$GITHUB_OUTPUT" ;;
            "0 20 * * *")     echo 'args=--canal-story' >> "$GITHUB_OUTPUT" ;;
            *)                echo 'args=${{ github.event.inputs.args }}' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publicar
        env:
          POSTS_FOLDER: ${{ github.workspace }}/diario/NOTAS AUTOMATICAS
          TAPA_FOLDER: ${{ github.workspace }}/diario/DIARIO PDF
          # Carpeta con los videos de actualidad bajados de Drive (desgrabador).
          VIDEOS_FOLDER: ${{ github.workspace }}/videos
          # Carpeta con los videos de la RADIO (radiodelcentro) para --transcribe-video-radio.
          VIDEOS_RADIO_FOLDER: ${{ github.workspace }}/videos_radio
          # Para subir el .mp4 del reel como asset de un GitHub Release (URL pública para IG).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Ejecutando: main.py ${{ steps.cmd.outputs.args }}"
          python main.py ${{ steps.cmd.outputs.args }}

      - name: Guardar registros anti-repeticion (para no duplicar la proxima vez)
        if: always()
        run: |
          mkdir -p state
          cp "diario/NOTAS AUTOMATICAS/.publicado.json" state/ 2>/dev/null || true
          cp "diario/NOTAS AUTOMATICAS/.historias.json" state/ 2>/dev/null || true
          cp "diario/NOTAS AUTOMATICAS/.web.json" state/ 2>/dev/null || true
          cp "diario/NOTAS AUTOMATICAS/.fb.json" state/ 2>/dev/null || true
          cp "diario/NOTAS AUTOMATICAS/.x.json" state/ 2>/dev/null || true
          for f in .tapa.json .farmacias.json .farmacias_cache.json .farmacias_aviso.json .carrusel_tf.json .carrusel_tf_aviso.json .muro_tf.json .canal_story.json youtube-historias.json .newsletter.json .reel.json .videos_contabilidad.json .videos_radio.json .notas_web.json .yt_desgrabaciones.json .yt_seo.json; do
            [ -f "$f" ] && cp "$f" state/ || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state/
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "Estado anti-repeticion [skip ci]"
            # Push a prueba de choques: si otro push avanzo el repo, reordena y reintenta.
            ok=0
            for intento in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then
                echo "Estado guardado."; ok=1; break
              fi
              echo "Push del estado rechazado, reintento $intento..."; sleep 4
            done
            if [ "$ok" != "1" ]; then echo "No se pudo guardar el estado tras varios intentos."; fi
          fi

      # Aviso por mail si la corrida FALLO o se CANCELO. El script solo avisa para las
      # corridas de PUBLICACION del diario (notas/historias/tapa-farmacias/notas-web); los
      # videos/radio/corresponsales/yt ya mandan su propio aviso, asi que se saltean.
      # LIMITE conocido: si una corrida se cancela mientras esta EN COLA (nunca arranca),
      # GitHub no ejecuta ningun paso, asi que este aviso no puede dispararse en ese caso
      # (por eso primero se separo la concurrencia por proyecto: para que casi no haya
      # cancelaciones en cola de las publicaciones).
      # OJO: cancelled()/failure() SOLO se pueden usar en `if:` (en `env:`/`run:` GitHub las
      # rechaza con "Unrecognized function" e invalida TODO el workflow -> 422 en el dispatch).
      # Por eso el resultado se calcula en dos pasos gateados por `if:` que escriben OUTCOME.
      - name: (aviso) marcar cancelada
        if: ${{ cancelled() }}
        run: echo "OUTCOME=cancelada" >> "$GITHUB_ENV"
      - name: (aviso) marcar fallida
        if: ${{ failure() }}
        run: echo "OUTCOME=fallida" >> "$GITHUB_ENV"
      - name: Avisar por mail si fallo o se cancelo (solo publicaciones)
        if: ${{ failure() || cancelled() }}
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CMD_ARGS: ${{ steps.cmd.outputs.args || github.event.inputs.args }}
          OUTCOME: ${{ env.OUTCOME }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Reescribe .env desde el secret por si la corrida fallo ANTES del paso de credenciales.
          printf '%s' "$ENV_FILE" > .env
          python notificar_corrida.py || echo "notificar_corrida.py no pudo correr (se ignora)."
